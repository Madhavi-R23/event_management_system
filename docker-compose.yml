name: aura-events # fixed project name so Jenkins and manual runs manage the same containers

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aura-app
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [aura-net]

  jenkins:
    build: ./jenkins
    container_name: aura-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks: [aura-net]

  prometheus:
    build: ./prometheus
    container_name: aura-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    depends_on:
      - app
    restart: unless-stopped
    networks: [aura-net]

volumes:
  jenkins_home:
  prometheus_data:

networks:
  aura-net:
